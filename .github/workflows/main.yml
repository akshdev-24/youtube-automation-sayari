name: Hinglish Shayari Shorts Automation

on:
  schedule:
    # 09:00 AM IST
    - cron: "0 9 * * *"
      timezone: "Asia/Kolkata"

    # 02:00 PM IST
    - cron: "0 14 * * *"
      timezone: "Asia/Kolkata"

  # IMPORTANT:
  # This enables the "Run workflow" button in GitHub Actions.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shayari-automation
  cancel-in-progress: false

jobs:
  generate-and-upload:
    name: Generate & Upload Shayari Short
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # =========================================================
      # 2. PYTHON
      # =========================================================
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      # =========================================================
      # 3. SYSTEM DEPENDENCIES
      # =========================================================
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fontconfig \
            fonts-dejavu \
            fonts-liberation \
            fonts-freefont-ttf

          echo "FFmpeg version:"
          ffmpeg -version | head -n 1

          echo ""
          echo "Available serif fonts:"
          fc-list | grep -Ei "Times|Liberation Serif|DejaVu Serif" | head -20 || true

      # =========================================================
      # 4. VERIFY PROJECT STRUCTURE
      # =========================================================
      - name: Verify project structure
        shell: bash
        run: |
          set -e

          echo "Checking project files..."

          test -f main.py
          test -f requirements.txt

          test -f src/shayari_generator.py
          test -f src/shayari_video.py
          test -f src/seo_engine.py
          test -f src/uploader.py

          test -d assets
          test -d assets/music

          echo "Project structure OK."

      # =========================================================
      # 5. VERIFY BACKGROUND ASSET
      # =========================================================
      - name: Verify background asset
        shell: bash
        run: |
          set -e

          echo "Searching for background..."

          if find assets -maxdepth 2 -type f \
            \( \
              -iname "*.jpg" \
              -o -iname "*.jpeg" \
              -o -iname "*.png" \
              -o -iname "*.webp" \
              -o -iname "*.mp4" \
              -o -iname "*.mov" \
              -o -iname "*.webm" \
            \) | grep -q .; then

            echo "Background asset found:"
            find assets -maxdepth 2 -type f \
              \( \
                -iname "*.jpg" \
                -o -iname "*.jpeg" \
                -o -iname "*.png" \
                -o -iname "*.webp" \
                -o -iname "*.mp4" \
                -o -iname "*.mov" \
                -o -iname "*.webm" \
              \)

          else
            echo "ERROR: No background image/video found in assets/"
            exit 1
          fi

      # =========================================================
      # 6. VERIFY MUSIC
      # =========================================================
      - name: Verify background music
        shell: bash
        run: |
          set -e

          echo "Searching for music..."

          if find assets/music -type f \
            \( \
              -iname "*.mp3" \
              -o -iname "*.wav" \
              -o -iname "*.m4a" \
              -o -iname "*.aac" \
              -o -iname "*.ogg" \
            \) | grep -q .; then

            echo "Music found:"
            find assets/music -type f \
              \( \
                -iname "*.mp3" \
                -o -iname "*.wav" \
                -o -iname "*.m4a" \
                -o -iname "*.aac" \
                -o -iname "*.ogg" \
              \)

          else
            echo "ERROR: No music file found in assets/music/"
            exit 1
          fi

      # =========================================================
      # 7. VERIFY TIMES NEW ROMAN
      # =========================================================
      - name: Verify Times New Roman Regular font
        shell: bash
        run: |
          set -e

          echo "Checking project font..."

          if [ -f "assets/fonts/times.ttf" ]; then
            echo "OK: assets/fonts/times.ttf found."
          elif [ -f "assets/fonts/times_new_roman.ttf" ]; then
            echo "OK: assets/fonts/times_new_roman.ttf found."
          else
            echo ""
            echo "WARNING:"
            echo "Exact Times New Roman Regular font was not found."
            echo "The video generator will use its configured serif fallback."
            echo ""
            echo "For exact Times New Roman output, add:"
            echo "assets/fonts/times.ttf"
          fi

      # =========================================================
      # 8. INSTALL PYTHON DEPENDENCIES
      # =========================================================
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =========================================================
      # 9. RESTORE YOUTUBE OAUTH CLIENT
      # =========================================================
      - name: Restore YouTube OAuth client
        shell: bash
        env:
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          set -e

          if [ -z "$YOUTUBE_CLIENT_SECRET" ]; then
            echo "ERROR: YOUTUBE_CLIENT_SECRET secret is missing."
            exit 1
          fi

          printf '%s' "$YOUTUBE_CLIENT_SECRET" > client_secrets.json

          python - <<'PY'
          import json

          with open("client_secrets.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          if "installed" not in data and "web" not in data:
              raise SystemExit(
                  "ERROR: client_secrets.json does not contain "
                  "'installed' or 'web' OAuth configuration."
              )

          print("YouTube OAuth client JSON is valid.")
          PY

      # =========================================================
      # 10. CHECK GEMINI SECRET
      # =========================================================
      - name: Verify Gemini API key
        shell: bash
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "ERROR: GOOGLE_API_KEY secret is missing."
            exit 1
          fi

          echo "GOOGLE_API_KEY is configured."

      # =========================================================
      # 11. CREATE REQUIRED DIRECTORIES
      # =========================================================
      - name: Prepare directories
        run: |
          mkdir -p output
          mkdir -p logs

      # =========================================================
      # 12. RUN AUTOMATION
      # =========================================================
      - name: Generate Shayari Short
        env:
          # -----------------------------------------------------
          # GEMINI
          # -----------------------------------------------------
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

          GEMINI_MODELS: >-
            gemini-3.6-flash,
            gemini-3.7-flash,
            gemini-3.8-flash

          # -----------------------------------------------------
          # VIDEO
          # -----------------------------------------------------
          # main.py itself forces 5/6/7 seconds.
          # Do NOT set this to 15.
          VIDEO_MIN_DURATION: "5"
          VIDEO_MAX_DURATION: "7"

          # -----------------------------------------------------
          # YOUTUBE
          # -----------------------------------------------------
          YOUTUBE_UPLOAD: "true"

          # Entertainment category
          YOUTUBE_CATEGORY_ID: "24"

          # NEVER publish automatically
          YOUTUBE_PRIVACY_STATUS: "unlisted"

          # -----------------------------------------------------
          # RETRIES
          # -----------------------------------------------------
          PIPELINE_RETRIES: "3"
          RETRY_DELAY: "15"

          # -----------------------------------------------------
          # PYTHON
          # -----------------------------------------------------
          PYTHONUNBUFFERED: "1"

        run: |
          set -e

          echo "=============================================="
          echo " HINGLISH SHAYARI SHORTS AUTOMATION"
          echo "=============================================="
          echo ""
          echo "Video duration : 5-7 seconds"
          echo "Resolution     : 1080x1920"
          echo "Category       : Entertainment (24)"
          echo "Privacy        : UNLISTED"
          echo "Voice          : OFF"
          echo "Text animation : OFF"
          echo ""

          python main.py

      # =========================================================
      # 13. VERIFY OUTPUT
      # =========================================================
      - name: Verify generated video
        shell: bash
        run: |
          set -e

          echo "Looking for generated MP4..."

          VIDEO_COUNT=$(find output -type f -iname "*.mp4" | wc -l)

          if [ "$VIDEO_COUNT" -eq 0 ]; then
            echo "ERROR: No MP4 video was generated."
            exit 1
          fi

          echo "Generated videos:"
          find output -type f -iname "*.mp4" -print

          for VIDEO in output/*.mp4; do

            if [ ! -f "$VIDEO" ]; then
              continue
            fi

            echo ""
            echo "Checking: $VIDEO"

            WIDTH=$(ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=width \
              -of csv=p=0 \
              "$VIDEO")

            HEIGHT=$(ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=height \
              -of csv=p=0 \
              "$VIDEO")

            DURATION=$(ffprobe \
              -v error \
              -show_entries format=duration \
              -of csv=p=0 \
              "$VIDEO")

            echo "Resolution: ${WIDTH}x${HEIGHT}"
            echo "Duration: ${DURATION}s"

            if [ "$WIDTH" != "1080" ]; then
              echo "ERROR: Width must be 1080."
              exit 1
            fi

            if [ "$HEIGHT" != "1920" ]; then
              echo "ERROR: Height must be 1920."
              exit 1
            fi

            python - "$DURATION" <<'PY'
          import sys

          duration = float(sys.argv[1])

          if not 4.8 <= duration <= 7.2:
              raise SystemExit(
                  f"ERROR: Video duration {duration:.3f}s "
                  "is outside the required 5-7 second range."
              )

          print(f"Duration OK: {duration:.3f}s")
          PY

          done

          echo ""
          echo "Video verification successful."

      # =========================================================
      # 14. SHOW GENERATED METADATA
      # =========================================================
      - name: Show generated metadata
        shell: bash
        run: |
          echo "Generated metadata files:"

          find output -type f \
            \( \
              -iname "*.json" \
              -o -iname "*.txt" \
            \) \
            -print || true

          echo ""

          for FILE in output/*.json; do
            if [ -f "$FILE" ]; then
              echo "=============================================="
              echo "$FILE"
              echo "=============================================="
              cat "$FILE"
              echo ""
            fi
          done

      # =========================================================
      # 15. UPLOAD ARTIFACT
      # =========================================================
      - name: Upload generated video artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shayari-short-${{ github.run_number }}
          path: |
            output/
            logs/
          if-no-files-found: warn
          retention-days: 7

      # =========================================================
      # 16. COMMIT CONTENT HISTORY
      # =========================================================
      - name: Commit content history
        if: success()
        shell: bash
        run: |
          set -e

          if [ ! -f content_history.json ]; then
            echo "No content_history.json found."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content_history.json

          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "Update Shayari content history [skip ci]"
            git push
            echo "Content history committed."
          fi

      # =========================================================
      # 17. REMOVE SECRETS
      # =========================================================
      - name: Cleanup OAuth credentials
        if: always()
        shell: bash
        run: |
          rm -f client_secrets.json
          rm -f credentials.json

          echo "OAuth credential files removed."

      # =========================================================
      # 18. FINAL STATUS
      # =========================================================
      - name: Final summary
        if: always()
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo " WORKFLOW SUMMARY"
          echo "=============================================="
          echo ""
          echo "Run number : ${{ github.run_number }}"
          echo "Trigger    : ${{ github.event_name }}"
          echo "Branch     : ${{ github.ref_name }}"
          echo ""
          echo "Expected:"
          echo "  Video       : 1080x1920"
          echo "  Duration    : 5-7 sec"
          echo "  Category    : Entertainment (24)"
          echo "  Privacy     : UNLISTED"
          echo "  Voice       : OFF"
          echo "  Animation   : OFF"
          echo "  SEO         : title + description + queries + tags + hashtags"
          echo ""
          echo "=============================================="
