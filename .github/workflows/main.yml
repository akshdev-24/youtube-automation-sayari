name: Hinglish Shayari Shorts Automation

on:
  schedule:
    # 09:00 AM IST
    - cron: "0 9 * * *"
      timezone: "Asia/Kolkata"

    # 02:00 PM IST
    - cron: "0 14 * * *"
      timezone: "Asia/Kolkata"

  # Manual Run Workflow button
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shayari-automation
  cancel-in-progress: false

jobs:
  generate-and-upload:

    name: Generate & Upload Shayari Short

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0


      # =========================================================
      # 2. PYTHON
      # =========================================================

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"


      # =========================================================
      # 3. INSTALL SYSTEM DEPENDENCIES
      # =========================================================

      - name: Install FFmpeg and fonts
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fontconfig \
            fonts-dejavu \
            fonts-liberation \
            fonts-freefont-ttf

          echo "=========================================="
          echo "FFmpeg"
          echo "=========================================="

          ffmpeg -version | head -n 1

          echo ""
          echo "=========================================="
          echo "Available serif fonts"
          echo "=========================================="

          fc-list | grep -Ei \
            "Times|Liberation Serif|DejaVu Serif" \
            | head -30 || true


      # =========================================================
      # 4. VERIFY PROJECT STRUCTURE
      # =========================================================

      - name: Verify project structure
        shell: bash
        run: |
          set -e

          echo "Checking project structure..."

          test -f main.py
          test -f requirements.txt

          test -f src/__init__.py
          test -f src/shayari_generator.py
          test -f src/shayari_video.py
          test -f src/seo_engine.py
          test -f src/uploader.py

          test -d assets
          test -d assets/music

          echo ""
          echo "Project structure OK."


      # =========================================================
      # 5. VERIFY BACKGROUND
      # =========================================================

      - name: Verify background asset
        shell: bash
        run: |
          set -e

          echo "Searching for background..."

          BACKGROUND_COUNT=$(find assets \
            -type f \
            \( \
              -iname "*.jpg" \
              -o -iname "*.jpeg" \
              -o -iname "*.png" \
              -o -iname "*.webp" \
              -o -iname "*.mp4" \
              -o -iname "*.mov" \
              -o -iname "*.webm" \
            \) | wc -l)

          if [ "$BACKGROUND_COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: No background image/video found."
            echo "Put your background inside assets/"
            exit 1
          fi

          echo ""
          echo "Background assets found:"

          find assets \
            -type f \
            \( \
              -iname "*.jpg" \
              -o -iname "*.jpeg" \
              -o -iname "*.png" \
              -o -iname "*.webp" \
              -o -iname "*.mp4" \
              -o -iname "*.mov" \
              -o -iname "*.webm" \
            \)


      # =========================================================
      # 6. VERIFY MUSIC
      # =========================================================

      - name: Verify music asset
        shell: bash
        run: |
          set -e

          echo "Searching for music..."

          MUSIC_COUNT=$(find assets/music \
            -type f \
            \( \
              -iname "*.mp3" \
              -o -iname "*.wav" \
              -o -iname "*.m4a" \
              -o -iname "*.aac" \
              -o -iname "*.ogg" \
            \) | wc -l)

          if [ "$MUSIC_COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: No music found in assets/music/"
            exit 1
          fi

          echo ""
          echo "Music assets found:"

          find assets/music \
            -type f \
            \( \
              -iname "*.mp3" \
              -o -iname "*.wav" \
              -o -iname "*.m4a" \
              -o -iname "*.aac" \
              -o -iname "*.ogg" \
            \)


      # =========================================================
      # 7. VERIFY TIMES NEW ROMAN
      # =========================================================

      - name: Verify Times New Roman font
        shell: bash
        run: |
          set -e

          echo "Checking Times New Roman Regular..."

          if [ -f "assets/fonts/times.ttf" ]; then

            echo "OK:"
            echo "assets/fonts/times.ttf found."

          elif [ -f "assets/fonts/times_new_roman.ttf" ]; then

            echo "OK:"
            echo "assets/fonts/times_new_roman.ttf found."

          else

            echo ""
            echo "WARNING:"
            echo "Exact Times New Roman Regular font was not found."
            echo ""
            echo "The generator will use its configured serif fallback."
            echo ""
            echo "For exact Times New Roman Regular:"
            echo "assets/fonts/times.ttf"

          fi


      # =========================================================
      # 8. INSTALL PYTHON PACKAGES
      # =========================================================

      - name: Install Python dependencies
        run: |
          set -e

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # =========================================================
      # 9. RESTORE YOUTUBE OAUTH FILES
      #
      # Existing GitHub Secrets:
      #
      # CLIENT_SECRET_B64
      # CREDENTIALS_B64
      #
      # =========================================================

      - name: Restore YouTube OAuth files
        shell: bash
        env:
          CLIENT_SECRET_B64: ${{ secrets.CLIENT_SECRET_B64 }}
          CREDENTIALS_B64: ${{ secrets.CREDENTIALS_B64 }}
        run: |
          set -e

          echo "Restoring YouTube OAuth files..."

          # -----------------------------------------------------
          # CLIENT SECRET
          # -----------------------------------------------------

          if [ -z "$CLIENT_SECRET_B64" ]; then
            echo ""
            echo "ERROR: CLIENT_SECRET_B64 secret is missing."
            exit 1
          fi

          # -----------------------------------------------------
          # CREDENTIALS
          # -----------------------------------------------------

          if [ -z "$CREDENTIALS_B64" ]; then
            echo ""
            echo "ERROR: CREDENTIALS_B64 secret is missing."
            exit 1
          fi

          # -----------------------------------------------------
          # DECODE
          # -----------------------------------------------------

          echo "$CLIENT_SECRET_B64" \
            | base64 --decode \
            > client_secrets.json

          echo "$CREDENTIALS_B64" \
            | base64 --decode \
            > credentials.json

          chmod 600 client_secrets.json
          chmod 600 credentials.json

          echo ""
          echo "OAuth files restored."


      # =========================================================
      # 10. VALIDATE OAUTH FILES
      # =========================================================

      - name: Validate YouTube OAuth files
        shell: bash
        run: |
          set -e

          python - <<'PY'
          import json
          import sys

          # -----------------------------------------------------
          # client_secrets.json
          # -----------------------------------------------------

          try:
              with open(
                  "client_secrets.json",
                  "r",
                  encoding="utf-8"
              ) as f:
                  client = json.load(f)
          except Exception as e:
              print("ERROR: Invalid client_secrets.json")
              print(e)
              sys.exit(1)

          if (
              "installed" not in client
              and "web" not in client
          ):
              print(
                  "ERROR: client_secrets.json does not contain "
                  "'installed' or 'web'."
              )
              sys.exit(1)

          print("client_secrets.json: OK")

          # -----------------------------------------------------
          # credentials.json
          # -----------------------------------------------------

          try:
              with open(
                  "credentials.json",
                  "r",
                  encoding="utf-8"
              ) as f:
                  credentials = json.load(f)
          except Exception as e:
              print("ERROR: Invalid credentials.json")
              print(e)
              sys.exit(1)

          if not credentials.get("refresh_token"):
              print(
                  "ERROR: credentials.json does not contain "
                  "a refresh_token."
              )
              sys.exit(1)

          print("credentials.json: OK")
          print("refresh_token: FOUND")

          print("")
          print("YouTube OAuth validation successful.")
          PY


      # =========================================================
      # 11. VERIFY GEMINI API KEY
      # =========================================================

      - name: Verify Gemini API key
        shell: bash
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          set -e

          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "ERROR: GOOGLE_API_KEY secret is missing."
            exit 1
          fi

          echo "GOOGLE_API_KEY is configured."


      # =========================================================
      # 12. PREPARE DIRECTORIES
      # =========================================================

      - name: Prepare directories
        run: |
          mkdir -p output
          mkdir -p logs


      # =========================================================
      # 13. RUN AUTOMATION
      # =========================================================

      - name: Generate and upload Shayari Short
        env:

          # -----------------------------------------------------
          # GEMINI
          # -----------------------------------------------------

          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

          GEMINI_MODELS: >-
            gemini-3.6-flash,
            gemini-3.7-flash,
            gemini-3.8-flash

          # -----------------------------------------------------
          # VIDEO
          # -----------------------------------------------------

          VIDEO_MIN_DURATION: "5"
          VIDEO_MAX_DURATION: "7"

          # -----------------------------------------------------
          # YOUTUBE
          # -----------------------------------------------------

          YOUTUBE_UPLOAD: "true"

          # Entertainment
          YOUTUBE_CATEGORY_ID: "24"

          # NEVER publish automatically
          YOUTUBE_PRIVACY_STATUS: "unlisted"

          # -----------------------------------------------------
          # RETRIES
          # -----------------------------------------------------

          PIPELINE_RETRIES: "3"
          RETRY_DELAY: "15"

          # -----------------------------------------------------
          # PYTHON
          # -----------------------------------------------------

          PYTHONUNBUFFERED: "1"

        run: |
          set -e

          echo ""
          echo "=============================================="
          echo " HINGLISH SHAYARI SHORTS AUTOMATION"
          echo "=============================================="
          echo ""
          echo "Resolution     : 1080x1920"
          echo "Duration       : 5-7 seconds"
          echo "Category       : Entertainment (24)"
          echo "Privacy        : UNLISTED"
          echo "Voice          : OFF"
          echo "TTS            : OFF"
          echo "Text animation : OFF"
          echo "Background     : User asset"
          echo "Music          : User asset"
          echo "SEO            : ENABLED"
          echo ""

          python main.py


      # =========================================================
      # 14. VERIFY VIDEO
      # =========================================================

      - name: Verify generated video
        shell: bash
        run: |
          set -e

          echo "Searching generated videos..."

          VIDEO_COUNT=$(find output \
            -type f \
            -iname "*.mp4" \
            | wc -l)

          if [ "$VIDEO_COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: No MP4 video generated."
            exit 1
          fi

          echo ""
          echo "Generated videos:"

          find output \
            -type f \
            -iname "*.mp4" \
            -print


          for VIDEO in output/*.mp4; do

            if [ ! -f "$VIDEO" ]; then
              continue
            fi

            echo ""
            echo "=============================================="
            echo "Checking: $VIDEO"
            echo "=============================================="


            WIDTH=$(ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=width \
              -of csv=p=0 \
              "$VIDEO")


            HEIGHT=$(ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=height \
              -of csv=p=0 \
              "$VIDEO")


            DURATION=$(ffprobe \
              -v error \
              -show_entries format=duration \
              -of csv=p=0 \
              "$VIDEO")


            echo "Width    : $WIDTH"
            echo "Height   : $HEIGHT"
            echo "Duration : $DURATION seconds"


            if [ "$WIDTH" != "1080" ]; then
              echo "ERROR: Width must be 1080."
              exit 1
            fi


            if [ "$HEIGHT" != "1920" ]; then
              echo "ERROR: Height must be 1920."
              exit 1
            fi


            python - "$DURATION" <<'PY'
          import sys

          duration = float(sys.argv[1])

          # Small encoding tolerance.
          if not 4.8 <= duration <= 7.2:
              raise SystemExit(
                  f"ERROR: Video duration "
                  f"{duration:.3f}s is outside "
                  "the required 5-7 second range."
              )

          print(
              f"Duration OK: "
              f"{duration:.3f}s"
          )
          PY

          done


          echo ""
          echo "Video verification successful."


      # =========================================================
      # 15. DISPLAY GENERATED SEO METADATA
      # =========================================================

      - name: Display generated metadata
        if: always()
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo " GENERATED METADATA"
          echo "=============================================="

          find output \
            -type f \
            \( \
              -iname "*.json" \
              -o -iname "*.txt" \
            \) \
            -print || true


          for FILE in output/*.json; do

            if [ -f "$FILE" ]; then

              echo ""
              echo "----------------------------------------------"
              echo "$FILE"
              echo "----------------------------------------------"

              cat "$FILE"

            fi

          done


      # =========================================================
      # 16. UPLOAD ARTIFACT
      # =========================================================

      - name: Upload generated files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shayari-short-${{ github.run_number }}
          path: |
            output/
            logs/
          if-no-files-found: warn
          retention-days: 7


      # =========================================================
      # 17. COMMIT CONTENT HISTORY
      # =========================================================

      - name: Commit content history
        if: success()
        shell: bash
        run: |
          set -e

          if [ ! -f content_history.json ]; then
            echo "content_history.json not found."
            exit 0
          fi


          git config \
            user.name \
            "github-actions[bot]"


          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add content_history.json


          if git diff --cached --quiet; then

            echo "No content history changes."

          else

            git commit \
              -m "Update Shayari content history [skip ci]"

            git push

            echo "Content history committed."

          fi


      # =========================================================
      # 18. CLEANUP SECRETS
      # =========================================================

      - name: Cleanup OAuth credentials
        if: always()
        shell: bash
        run: |
          rm -f client_secrets.json
          rm -f credentials.json

          echo "OAuth credential files removed."


      # =========================================================
      # 19. FINAL SUMMARY
      # =========================================================

      - name: Final summary
        if: always()
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo " WORKFLOW SUMMARY"
          echo "=============================================="
          echo ""
          echo "Run number : ${{ github.run_number }}"
          echo "Trigger    : ${{ github.event_name }}"
          echo "Branch     : ${{ github.ref_name }}"
          echo ""
          echo "Configuration:"
          echo "  Resolution : 1080x1920"
          echo "  Duration   : 5-7 sec"
          echo "  Category   : Entertainment (24)"
          echo "  Privacy    : UNLISTED"
          echo "  Voice      : OFF"
          echo "  TTS        : OFF"
          echo "  Animation  : OFF"
          echo "  SEO        : ENABLED"
          echo ""
          echo "OAuth:"
          echo "  CLIENT_SECRET_B64 : configured"
          echo "  CREDENTIALS_B64   : configured"
          echo ""
          echo "=============================================="
