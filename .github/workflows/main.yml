# ============================================================
# FILE: .github/workflows/main.yml
# HINGLISH SHAYARI SHORTS AUTOMATION
# ============================================================

name: Hinglish Shayari Shorts Factory

on:
  # 09:00 AM IST = 03:30 UTC
  # 02:00 PM IST = 08:30 UTC
  schedule:
    - cron: "30 3 * * *"
    - cron: "30 8 * * *"

  # Manual run from GitHub Actions
  workflow_dispatch:

# Prevent two uploads from running at the same time.
concurrency:
  group: shayari-production
  cancel-in-progress: false

permissions:
  contents: write


jobs:

  build-and-upload:

    name: Generate & Upload Shayari Short

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # ======================================================
      # 1. CHECKOUT REPOSITORY
      # ======================================================

      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ======================================================
      # 2. SETUP PYTHON
      # ======================================================

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip


      # ======================================================
      # 3. INSTALL FFMPEG
      # ======================================================

      - name: 🎬 Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg


      # ======================================================
      # 4. INSTALL FONTS
      # ======================================================

      - name: 🔤 Install fonts
        run: |
          sudo apt-get install -y fonts-noto-core
          sudo apt-get install -y fonts-noto-extra


      # ======================================================
      # 5. INSTALL PYTHON DEPENDENCIES
      # ======================================================

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ======================================================
      # 6. RESTORE YOUTUBE OAUTH FILES
      # ======================================================
      #
      # GitHub Secrets required:
      #
      # CLIENT_SECRET_B64
      # CREDENTIALS_B64
      #
      # These contain base64 encoded JSON files.
      #
      # client_secrets.json
      # credentials.json
      #
      # ======================================================

      - name: 🔐 Restore YouTube OAuth files
        env:
          CLIENT_SECRET_B64: ${{ secrets.CLIENT_SECRET_B64 }}
          CREDENTIALS_B64: ${{ secrets.CREDENTIALS_B64 }}
        run: |

          set -e

          if [ -z "$CLIENT_SECRET_B64" ]; then
            echo "❌ CLIENT_SECRET_B64 secret is missing."
            exit 1
          fi

          if [ -z "$CREDENTIALS_B64" ]; then
            echo "❌ CREDENTIALS_B64 secret is missing."
            exit 1
          fi

          echo "$CLIENT_SECRET_B64" | base64 --decode > client_secrets.json
          echo "$CREDENTIALS_B64" | base64 --decode > credentials.json

          chmod 600 client_secrets.json
          chmod 600 credentials.json

          echo "✅ YouTube OAuth files restored."


      # ======================================================
      # 7. CHECK ASSETS
      # ======================================================

      - name: 🎨 Check assets
        run: |

          echo "Checking assets..."

          if [ ! -d "assets" ]; then
            echo "❌ assets folder missing."
            exit 1
          fi

          echo ""
          echo "📁 Assets:"
          find assets -maxdepth 2 -type f | sort

          echo ""

          if [ ! -f "assets/fallback.jpg" ]; then
            echo "⚠️ assets/fallback.jpg not found."
            echo "The video generator may fail if no background exists."
          fi

          if [ -d "assets/music" ]; then
            echo "🎵 Music files:"
            find assets/music -type f | sort
          else
            echo "⚠️ assets/music folder not found."
          fi


      # ======================================================
      # 8. GENERATE + UPLOAD
      # ======================================================

      - name: 🤖 Generate Shayari + 🎬 Create Video + 📤 Upload
        env:

          # Gemini
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

          # YouTube
          YOUTUBE_UPLOAD: "true"

          # Gemini model
          GEMINI_MODEL: "gemini-3.6-flash"

          # Video
          SHAYARI_DURATION: "15"

          # Pipeline retry
          PIPELINE_RETRIES: "2"

          # YouTube settings
          YOUTUBE_PRIVACY_STATUS: "public"
          YOUTUBE_CATEGORY_ID: "22"

          # Upload retry
          YOUTUBE_UPLOAD_RETRIES: "3"
          YOUTUBE_RETRY_DELAY: "10"

        run: |

          set -e

          echo "=================================================="
          echo "💔 HINGLISH SHAYARI SHORTS FACTORY"
          echo "=================================================="

          echo ""
          echo "🕐 UTC time:"
          date -u

          echo ""
          echo "🕐 IST time:"
          TZ=Asia/Kolkata date

          echo ""
          echo "🤖 Starting automation..."

          python main.py


      # ======================================================
      # 9. SHOW OUTPUT FILES
      # ======================================================

      - name: 📂 List generated files
        if: always()
        run: |

          echo "=================================================="
          echo "GENERATED FILES"
          echo "=================================================="

          if [ -d "output" ]; then
            find output -maxdepth 2 -type f -printf "%p - %s bytes\n" | sort
          else
            echo "No output directory found."
          fi


      # ======================================================
      # 10. SAVE VIDEO AS GITHUB ARTIFACT
      # ======================================================

      - name: 📦 Upload generated video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shayari-short-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.json
          if-no-files-found: warn
          retention-days: 7


      # ======================================================
      # 11. UPDATE CONTENT HISTORY
      # ======================================================

      - name: 💾 Commit content history
        if: success()
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content_history.json

          if git diff --cached --quiet; then
            echo "ℹ️ No content history changes."
          else
            git commit -m "chore: update shayari content history"
            git push
            echo "✅ Content history committed."
          fi


      # ======================================================
      # 12. CLEAN OAUTH FILES
      # ======================================================

      - name: 🧹 Cleanup secrets
        if: always()
        run: |

          rm -f client_secrets.json
          rm -f credentials.json

          echo "🧹 OAuth files removed."
