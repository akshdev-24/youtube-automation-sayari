name: Autonomous AI Course Generator

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ==========================================
      # SYSTEM DEPENDENCIES
      # ==========================================

      - name: 🧰 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ffmpeg fonts-noto-core

          echo "🔎 Finding ImageMagick policy.xml..."

          POLICY_FILE=$(find /etc -name "policy.xml" 2>/dev/null | grep -i "ImageMagick" | head -n 1)

          if [ -z "$POLICY_FILE" ]; then
            echo "❌ CRITICAL: Could not find ImageMagick policy.xml!"
            exit 1
          fi

          echo "✅ Found policy file at: $POLICY_FILE"

          echo "🔧 Applying ImageMagick limits..."

          sudo sed -i 's/<policy domain="resource" name="width" value=".*"\/>/<policy domain="resource" name="width" value="16384"\/>/' "$POLICY_FILE"

          sudo sed -i 's/<policy domain="resource" name="height" value=".*"\/>/<policy domain="resource" name="height" value="16384"\/>/' "$POLICY_FILE"

          echo "✅ ImageMagick configuration updated."

      # ==========================================
      # PYTHON DEPENDENCIES
      # ==========================================

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "✅ Python dependencies installed."

      # ==========================================
      # GOOGLE / API CREDENTIALS
      # ==========================================

      - name: 🔑 Restore API credentials from base64
        env:
          CLIENT_SECRET_B64: ${{ secrets.CLIENT_SECRET_B64 }}
          CREDENTIALS_B64: ${{ secrets.CREDENTIALS_B64 }}
        run: |
          echo "$CLIENT_SECRET_B64" | base64 -d > client_secrets.json
          echo "$CREDENTIALS_B64" | base64 -d > credentials.json

          echo "✅ Google credential files restored."

      # ==========================================
      # RUN AUTOMATION
      # ==========================================

      - name: 🚀 Run Autonomous Production Pipeline
        id: production-run
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python main.py

      # ==========================================
      # DEBUG AUDIO
      # ==========================================

      - name: 🔎 Upload Audio Artifact for Debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-debug-files
          path: output/*.wav
          if-no-files-found: ignore

      # ==========================================
      # DEBUG VIDEOS
      # ==========================================

      - name: 🎥 Upload Final Video for Debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-videos
          path: output/*.mp4
          if-no-files-found: ignore

      # ==========================================
      # DEMO GIF
      # ==========================================

      - name: 🎞️ Generate demo GIF from latest video
        if: steps.production-run.outcome == 'success'
        run: |
          mkdir -p images

          VIDEO=$(ls output/long_video_*.mp4 2>/dev/null | head -n 1)

          if [ -n "$VIDEO" ]; then
            echo "✅ Found video: $VIDEO"
            echo "🎞️ Converting first 12 seconds to GIF..."

            ffmpeg -y \
              -ss 0 \
              -t 12 \
              -i "$VIDEO" \
              -filter_complex "[0:v]fps=8,scale=320:-1:flags=lanczos,split[a][b];[a]palettegen[p];[b][p]paletteuse" \
              images/demo.gif

            echo "✅ Demo GIF created."
          else
            echo "⚠️ No long video found. Skipping GIF."
          fi

      # ==========================================
      # COMMIT GENERATED DATA
      # ==========================================

      - name: 💾 Commit and push content plan and demo GIF
        if: steps.production-run.outcome == 'success'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          STAGING=$(mktemp -d)

          cp content_plan.json "$STAGING/"

          if [ -f images/demo.gif ]; then
            cp images/demo.gif "$STAGING/"
          fi

          for attempt in 1 2 3; do

            echo "🔄 Push attempt $attempt..."

            git fetch origin main
            git reset --hard origin/main

            cp "$STAGING/content_plan.json" content_plan.json

            if [ -f "$STAGING/demo.gif" ]; then
              mkdir -p images
              cp "$STAGING/demo.gif" images/demo.gif
            fi

            git add content_plan.json images/demo.gif

            if git diff --cached --quiet; then
              echo "✅ Nothing to commit."
              exit 0
            fi

            git commit -m "feat: Update content plan and demo GIF after video production"

            if git push; then
              echo "✅ Successfully pushed on attempt $attempt."
              exit 0
            fi

            echo "⚠️ Push rejected. Retrying..."
          done

          echo "❌ Could not push after 3 attempts."
          exit 1
