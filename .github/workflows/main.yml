import os
import sys
import time
import json
import logging
from pathlib import Path
from datetime import datetime, timezone


# ============================================================
# IMPORT MODULES
# ============================================================

# IMPORTANT:
# Import the whole module instead of importing only the function.
#
# This allows us to dynamically change:
#
#     shayari_generator.MODEL
#
# when switching Gemini models.
#
import src.shayari_generator as shayari_generator

from src.shayari_video import create_video

from src.uploader import upload_short_to_youtube


# ============================================================
# DIRECTORIES
# ============================================================

BASE_DIR = Path(
    __file__
).resolve().parent

OUTPUT_DIR = (
    BASE_DIR / "output"
)

OUTPUT_DIR.mkdir(
    parents=True,
    exist_ok=True
)


# ============================================================
# SETTINGS
# ============================================================

VIDEO_DURATION = int(
    os.getenv(
        "SHAYARI_DURATION",
        "15"
    )
)

YOUTUBE_UPLOAD = (
    os.getenv(
        "YOUTUBE_UPLOAD",
        "true"
    ).lower()
    == "true"
)

PIPELINE_RETRIES = int(
    os.getenv(
        "PIPELINE_RETRIES",
        "3"
    )
)

RETRY_DELAY = int(
    os.getenv(
        "RETRY_DELAY",
        "15"
    )
)


# ============================================================
# GEMINI MODELS
# ============================================================
#
# Priority order:
#
# 1. gemini-3.6-flash
# 2. gemini-3.7-flash
# 3. gemini-3.8-flash
#
# You can change these from GitHub Actions using:
#
# GEMINI_MODELS
#
# Example:
#
# GEMINI_MODELS:
#   "gemini-3.6-flash,gemini-3.7-flash,gemini-3.8-flash"
#
# ============================================================

DEFAULT_GEMINI_MODELS = [
    "gemini-3.6-flash",
    "gemini-3.7-flash",
    "gemini-3.8-flash",
]


def get_gemini_models():

    value = os.getenv(
        "GEMINI_MODELS",
        ""
    ).strip()

    if not value:

        return (
            DEFAULT_GEMINI_MODELS.copy()
        )

    models = []

    for model in value.split(","):

        model = model.strip()

        if (
            model
            and model not in models
        ):

            models.append(
                model
            )

    if not models:

        return (
            DEFAULT_GEMINI_MODELS.copy()
        )

    return models


GEMINI_MODELS = (
    get_gemini_models()
)


# ============================================================
# LOGGING
# ============================================================

logging.basicConfig(
    level=logging.INFO,
    format=(
        "%(asctime)s | "
        "%(levelname)s | "
        "%(message)s"
    )
)

logger = logging.getLogger(
    "hinglish-shayari"
)


# ============================================================
# TIME
# ============================================================

def utc_now():

    return datetime.now(
        timezone.utc
    ).isoformat()


# ============================================================
# SAFE FILENAME
# ============================================================

def safe_filename(text):

    allowed = (
        "abcdefghijklmnopqrstuvwxyz"
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
        "0123456789"
        " -_"
    )

    cleaned = ""

    for char in str(text):

        if char in allowed:

            cleaned += char

        else:

            cleaned += "_"

    cleaned = "_".join(
        cleaned.split()
    )

    if not cleaned:

        cleaned = "shayari_short"

    return cleaned[:80]


# ============================================================
# ROMAN HINDI VALIDATION
# ============================================================

def validate_roman_hindi(text):

    if not text:

        return False

    for char in str(text):

        code = ord(char)

        # Devanagari
        if (
            0x0900
            <= code
            <= 0x097F
        ):

            return False

        # Arabic / Urdu
        if (
            0x0600
            <= code
            <= 0x06FF
        ):

            return False

    return True


# ============================================================
# SWITCH GEMINI MODEL
# ============================================================

def switch_gemini_model(model):

    logger.info(
        "🔄 Switching Gemini model → %s",
        model
    )

    # Environment variable
    os.environ[
        "GEMINI_MODEL"
    ] = model

    # Module-level MODEL variable
    #
    # This is important because some versions of
    # shayari_generator.py use:
    #
    # MODEL = os.getenv(...)
    #
    # at import time.
    #
    # Updating it here guarantees the next call
    # uses the new model.
    #
    try:

        shayari_generator.MODEL = model

    except Exception:

        pass

    logger.info(
        "🤖 Active Gemini model: %s",
        model
    )


# ============================================================
# DETECT QUOTA / RATE LIMIT
# ============================================================

def is_quota_error(error):

    text = str(
        error
    ).lower()

    indicators = [

        "429",

        "resource_exhausted",

        "quota",

        "rate limit",

        "rate_limit",

        "too many requests",

        "generate_requests_per_day",

        "limit: 20",

    ]

    return any(
        item in text
        for item in indicators
    )


# ============================================================
# GENERATE SHAYARI WITH MODEL SWITCHING
# ============================================================

def generate_content():

    last_error = None

    total_models = len(
        GEMINI_MODELS
    )

    for index, model in enumerate(
        GEMINI_MODELS
    ):

        logger.info(
            ""
        )

        logger.info(
            "🤖 Gemini attempt "
            "%d/%d",
            index + 1,
            total_models
        )

        logger.info(
            "Model: %s",
            model
        )

        switch_gemini_model(
            model
        )

        try:

            content = (
                shayari_generator
                .generate_shayari()
            )

            if not content:

                raise RuntimeError(
                    "Gemini returned empty content."
                )

            if not isinstance(
                content,
                dict
            ):

                raise RuntimeError(
                    "Gemini response is not a dictionary."
                )

            shayari = str(
                content.get(
                    "shayari",
                    ""
                )
            ).strip()

            if not shayari:

                raise RuntimeError(
                    "Generated Shayari is empty."
                )

            # --------------------------------------------
            # Roman Hindi check
            # --------------------------------------------

            if not validate_roman_hindi(
                shayari
            ):

                raise RuntimeError(
                    "Generated Shayari contains "
                    "Devanagari or Urdu characters."
                )

            # --------------------------------------------
            # Store model name
            # --------------------------------------------

            content[
                "_gemini_model"
            ] = model

            logger.info(
                "✅ Shayari generated successfully."
            )

            logger.info(
                "🤖 Model used: %s",
                model
            )

            return content

        except Exception as error:

            last_error = error

            logger.warning(
                "❌ Gemini model failed: %s",
                error
            )

            # --------------------------------------------
            # QUOTA ERROR
            # --------------------------------------------

            if is_quota_error(
                error
            ):

                logger.warning(
                    "🚫 Gemini quota/rate-limit detected."
                )

                if (
                    index + 1
                    < total_models
                ):

                    next_model = (
                        GEMINI_MODELS[
                            index + 1
                        ]
                    )

                    logger.info(
                        "➡️ Automatically switching:"
                    )

                    logger.info(
                        "%s → %s",
                        model,
                        next_model
                    )

                    # DO NOT wait 15/30/60 seconds
                    # for daily quota.
                    #
                    # Immediately switch model.

                    continue

                logger.warning(
                    "⚠️ All Gemini models exhausted."
                )

                break

            # --------------------------------------------
            # NORMAL MODEL ERROR
            # --------------------------------------------

            if (
                index + 1
                < total_models
            ):

                next_model = (
                    GEMINI_MODELS[
                        index + 1
                    ]
                )

                logger.info(
                    "➡️ Switching model:"
                )

                logger.info(
                    "%s → %s",
                    model,
                    next_model
                )

                time.sleep(2)

                continue

    # ========================================================
    # ALL GEMINI MODELS FAILED
    # ========================================================

    logger.warning(
        ""
    )

    logger.warning(
        "⚠️ All Gemini models failed."
    )

    if last_error:

        logger.warning(
            "Last error: %s",
            last_error
        )

    # --------------------------------------------------------
    # LOCAL FALLBACK
    # --------------------------------------------------------
    #
    # IMPORTANT:
    # generate_shayari() already contains the local
    # fallback pool.
    #
    # We call it one final time.
    #
    # --------------------------------------------------------

    logger.info(
        "🛟 Using local Shayari fallback..."
    )

    try:

        fallback_model = (
            GEMINI_MODELS[-1]
        )

        switch_gemini_model(
            fallback_model
        )

        fallback = (
            shayari_generator
            .generate_shayari()
        )

        if fallback:

            fallback[
                "_gemini_model"
            ] = "LOCAL_FALLBACK"

            logger.info(
                "✅ Local fallback Shayari ready."
            )

            return fallback

    except Exception as error:

        logger.error(
            "❌ Local fallback failed: %s",
            error
        )

    raise RuntimeError(
        "Gemini models and local fallback failed."
    )


# ============================================================
# CREATE VIDEO
# ============================================================

def generate_video_file(
    content,
    attempt
):

    title = content.get(
        "title",
        "Dard Bhari Shayari"
    )

    filename = (
        f"{safe_filename(title)}"
        f"_{int(time.time())}"
        f"_{attempt}.mp4"
    )

    output_path = (
        OUTPUT_DIR / filename
    )

    logger.info(
        ""
    )

    logger.info(
        "🎬 Creating Shayari video..."
    )

    logger.info(
        "📐 Resolution: 1080x1920"
    )

    logger.info(
        "⏱️ Duration: %s seconds",
        VIDEO_DURATION
    )

    # IMPORTANT:
    #
    # Positional arguments are used intentionally.
    #
    # This fixes:
    #
    # create_video() got an unexpected
    # keyword argument 'shayari'
    #
    result = create_video(
        content["shayari"],
        str(output_path),
        VIDEO_DURATION,
    )

    # --------------------------------------------------------
    # Handle functions that return output path
    # --------------------------------------------------------

    if result:

        result_path = Path(
            str(result)
        )

        if result_path.exists():

            output_path = (
                result_path
            )

    # --------------------------------------------------------
    # Verify output
    # --------------------------------------------------------

    if not output_path.exists():

        raise RuntimeError(
            "Video generation finished but "
            "MP4 file was not found."
        )

    file_size = (
        output_path.stat().st_size
        / (1024 * 1024)
    )

    if file_size < 0.1:

        raise RuntimeError(
            "Generated MP4 is suspiciously small."
        )

    logger.info(
        "✅ Video created successfully."
    )

    logger.info(
        "🎥 %s",
        output_path
    )

    logger.info(
        "📦 Size: %.2f MB",
        file_size
    )

    return output_path


# ============================================================
# SAVE METADATA
# ============================================================

def save_metadata(
    content,
    video_path
):

    metadata = {

        "created_at":
            utc_now(),

        "title":
            content.get(
                "title",
                ""
            ),

        "description":
            content.get(
                "description",
                ""
            ),

        "hashtags":
            content.get(
                "hashtags",
                []
            ),

        "tags":
            content.get(
                "tags",
                []
            ),

        "shayari":
            content.get(
                "shayari",
                ""
            ),

        "gemini_model":
            content.get(
                "_gemini_model",
                "unknown"
            ),

        "video":
            str(video_path),

    }

    metadata_path = (
        Path(video_path)
        .with_suffix(".json")
    )

    with open(
        metadata_path,
        "w",
        encoding="utf-8"
    ) as file:

        json.dump(
            metadata,
            file,
            ensure_ascii=False,
            indent=2
        )

    logger.info(
        "📝 Metadata saved: %s",
        metadata_path
    )

    return metadata_path


# ============================================================
# SAVE CONTENT HISTORY
# ============================================================

def update_history(
    content
):

    try:

        shayari_generator.save_history(
            content
        )

        logger.info(
            "📚 Content history updated."
        )

    except Exception as error:

        logger.warning(
            "⚠️ Could not update history: %s",
            error
        )


# ============================================================
# YOUTUBE UPLOAD
# ============================================================

def upload_video(
    content,
    video_path
):

    if not YOUTUBE_UPLOAD:

        logger.info(
            "⏭️ YouTube upload disabled."
        )

        return None

    title = content.get(
        "title",
        "Dard Bhari Shayari 💔"
    )

    description = content.get(
        "description",
        ""
    )

    tags = content.get(
        "tags",
        []
    )

    logger.info(
        ""
    )

    logger.info(
        "📤 Uploading to YouTube..."
    )

    logger.info(
        "🔒 Privacy: UNLISTED"
    )

    result = upload_short_to_youtube(
        video_path=str(
            video_path
        ),
        title=title,
        description=description,
        tags=tags,
        thumbnail_path=None,
    )

    if not result:

        raise RuntimeError(
            "YouTube uploader returned no result."
        )

    privacy = str(
        result.get(
            "privacy_status",
            ""
        )
    ).lower()

    # --------------------------------------------------------
    # SAFETY CHECK
    # --------------------------------------------------------

    if privacy:

        if privacy != "unlisted":

            raise RuntimeError(
                "SAFETY CHECK FAILED: "
                f"YouTube returned privacy "
                f"'{privacy}' instead of 'unlisted'."
            )

    logger.info(
        "✅ YouTube upload successful."
    )

    logger.info(
        "🔒 Video is UNLISTED."
    )

    if result.get(
        "video_id"
    ):

        logger.info(
            "🆔 Video ID: %s",
            result["video_id"]
        )

    if result.get(
        "shorts_url"
    ):

        logger.info(
            "🔗 Shorts URL: %s",
            result["shorts_url"]
        )

    return result


# ============================================================
# PIPELINE
# ============================================================

def run_pipeline():

    logger.info(
        ""
    )

    logger.info(
        "=" * 60
    )

    logger.info(
        "🚀 HINGLISH SHAYARI AUTOMATION"
    )

    logger.info(
        "=" * 60
    )

    logger.info(
        "🤖 Gemini model priority:"
    )

    for number, model in enumerate(
        GEMINI_MODELS,
        start=1
    ):

        logger.info(
            "   %d. %s",
            number,
            model
        )

    logger.info(
        ""
    )

    logger.info(
        "🎥 Video: 1080x1920"
    )

    logger.info(
        "⏱️ Duration: %s seconds",
        VIDEO_DURATION
    )

    logger.info(
        "🔒 YouTube: UNLISTED"
    )

    last_error = None

    # ========================================================
    # PIPELINE RETRIES
    # ========================================================

    for attempt in range(
        1,
        PIPELINE_RETRIES + 1
    ):

        logger.info(
            ""
        )

        logger.info(
            "🔁 Pipeline attempt %d/%d",
            attempt,
            PIPELINE_RETRIES
        )

        try:

            # ------------------------------------------------
            # STEP 1
            # ------------------------------------------------

            content = (
                generate_content()
            )

            logger.info(
                ""
            )

            logger.info(
                "✍️ Generated Shayari:"
            )

            logger.info(
                "%s",
                content["shayari"]
            )

            logger.info(
                ""
            )

            logger.info(
                "🏷️ Title: %s",
                content.get(
                    "title",
                    ""
                )
            )

            logger.info(
                "🤖 Generator: %s",
                content.get(
                    "_gemini_model",
                    "unknown"
                )
            )

            # ------------------------------------------------
            # STEP 2
            # ------------------------------------------------

            if not validate_roman_hindi(
                content["shayari"]
            ):

                raise RuntimeError(
                    "Shayari contains Devanagari/Urdu."
                )

            # ------------------------------------------------
            # STEP 3
            # ------------------------------------------------

            video_path = (
                generate_video_file(
                    content,
                    attempt
                )
            )

            # ------------------------------------------------
            # STEP 4
            # ------------------------------------------------

            metadata_path = (
                save_metadata(
                    content,
                    video_path
                )
            )

            # ------------------------------------------------
            # STEP 5
            # ------------------------------------------------

            update_history(
                content
            )

            # ------------------------------------------------
            # STEP 6
            # ------------------------------------------------

            upload_result = (
                upload_video(
                    content,
                    video_path
                )
            )

            # =================================================
            # SUCCESS
            # =================================================

            logger.info(
                ""
            )

            logger.info(
                "=" * 60
            )

            logger.info(
                "🎉 AUTOMATION COMPLETED"
            )

            logger.info(
                "=" * 60
            )

            logger.info(
                "🎬 Video: %s",
                video_path
            )

            logger.info(
                "📝 Metadata: %s",
                metadata_path
            )

            if upload_result:

                logger.info(
                    "📺 YouTube: %s",
                    upload_result.get(
                        "shorts_url",
                        upload_result.get(
                            "url",
                            "uploaded"
                        )
                    )
                )

            logger.info(
                "=" * 60
            )

            return {
                "success": True,

                "video_path":
                    str(video_path),

                "metadata_path":
                    str(metadata_path),

                "upload":
                    upload_result,
            }

        except Exception as error:

            last_error = error

            logger.exception(
                "❌ Pipeline attempt %d failed.",
                attempt
            )

            if (
                attempt
                >= PIPELINE_RETRIES
            ):

                break

            logger.info(
                "⏳ Waiting %s seconds...",
                RETRY_DELAY
            )

            time.sleep(
                RETRY_DELAY
            )

    # ========================================================
    # FAILURE
    # ========================================================

    logger.error(
        ""
    )

    logger.error(
        "=" * 60
    )

    logger.error(
        "💥 AUTOMATION FAILED"
    )

    logger.error(
        "=" * 60
    )

    if last_error:

        logger.error(
            "Last error: %s",
            last_error
        )

    return {
        "success": False,

        "error":
            str(last_error)
            if last_error
            else "Unknown error",
    }


# ============================================================
# MAIN
# ============================================================

def main():

    try:

        result = run_pipeline()

        if result.get(
            "success"
        ):

            return 0

        return 1

    except KeyboardInterrupt:

        logger.warning(
            "🛑 Automation interrupted."
        )

        return 130

    except Exception as error:

        logger.exception(
            "💥 Fatal error: %s",
            error
        )

        return 1


# ============================================================
# ENTRY POINT
# ============================================================

if __name__ == "__main__":

    sys.exit(
        main()
    )
